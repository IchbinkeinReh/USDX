<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Impressum & Datenschutz – UltraStar</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0d0f14">
<!-- Eigene Seite, nicht Teil der App: Sie braucht weder Sitzung noch
     Dienstarbeiter und laesst sich deshalb bei einem Vorschalt-Server mit
     Anmeldung einzeln freigeben - ein Impressum muss jeder lesen koennen. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f14;color:#e8e8ea;font-family:system-ui,sans-serif;
       line-height:1.55}
  main{max-width:760px;margin:0 auto;
       padding:20px 18px calc(40px + env(safe-area-inset-bottom))}
  a{color:#8fb1ff}
  .zurueck{display:inline-block;margin-bottom:18px;color:#98a0b0;text-decoration:none;
           font-size:15px}
  .zurueck:hover{color:#e8e8ea}
  h1{font-size:26px;margin:0 0 14px}
  h2{font-size:21px;margin:26px 0 8px}
  h3{font-size:18px;margin:20px 0 6px}
  h4{font-size:16px;margin:16px 0 4px}
  p,li{font-size:16px;color:#d4d8e2}
  ul{padding-left:22px}
  #text{overflow-wrap:anywhere}
  .leise{color:#98a0b0}
  #lizenzen_teil{margin-top:44px;padding-top:22px;border-top:1px solid #232936}
  .lizenz{background:#171a22;border-radius:12px;margin-bottom:10px}
  .lizenz summary{cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;
                  gap:4px 12px;align-items:baseline;list-style:none}
  .lizenz summary::-webkit-details-marker{display:none}
  .lizenz summary::before{content:'▸';color:#98a0b0}
  .lizenz[open] summary::before{content:'▾'}
  .lname{font-weight:600}
  .lart{color:#ffd978;font-size:14px}
  .lzweck{color:#98a0b0;font-size:14px;flex-basis:100%;padding-left:18px}
  .ladresse{margin:0 16px 8px;font-size:14px}
  .lizenz pre{margin:0;padding:12px 16px 16px;font-size:12px;line-height:1.45;
              color:#c7cddb;white-space:pre-wrap;overflow-wrap:anywhere;
              max-height:420px;overflow:auto;border-top:1px solid #232936}
</style>
</head>
<body>
<main>
  <a class="zurueck" href="/">← Zurück zu UltraStar</a>
  <h1>Impressum &amp; Datenschutz</h1>
  <div id="text" class="leise">lädt …</div>

  <section id="lizenzen_teil">
    <h1>Lizenzen</h1>
    <p>UltraStar Deluxe ist freie Software. Die Weboberfläche kommt ohne
      fremde Bibliotheken aus; der Server bindet die folgenden ein. Zum
      Lesen des vollständigen Lizenztexts auf einen Eintrag tippen.</p>
    <div id="lizenzen" class="leise">lädt …</div>
  </section>
</main>
<script type="module">
import { textZuHtml, lizenzenZuHtml } from './js/rechtliches.js';

const $ = (id) => document.getElementById(id);

async function ladeText() {
  try {
    const r = await fetch('/api/impressum', { cache: 'no-store' });
    if (r.status === 404) {
      $('text').textContent = 'Hier ist noch kein Impressum hinterlegt.';
      return;
    }
    if (!r.ok) throw new Error(r.status);
    $('text').innerHTML = textZuHtml(await r.text());
    $('text').classList.remove('leise');
  } catch (e) {
    $('text').textContent = 'Das Impressum lässt sich gerade nicht laden.';
  }
}

async function ladeLizenzen() {
  try {
    const r = await fetch('/lizenzen.json');
    if (!r.ok) throw new Error(r.status);
    $('lizenzen').innerHTML = lizenzenZuHtml(await r.json());
    $('lizenzen').classList.remove('leise');
  } catch (e) {
    $('lizenzen').textContent = 'Die Lizenzliste lässt sich gerade nicht laden.';
  }
}

// Fuer den Browsertest: woran sich ablesen laesst, dass beides da ist.
Promise.all([ladeText(), ladeLizenzen()])
  .then(() => { document.documentElement.dataset.bereit = '1'; });
</script>
</body>
</html>
